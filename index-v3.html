<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#142329"><title>浮生無界・萬世因果 V0.3 人物測試</title><style>:root{color-scheme:dark;--bg:#101a1e;--panel:#1d2b31;--line:#3b5057;--text:#f3ede0;--muted:#b1bdbe;--gold:#e6c17c;--green:#9ed6ad}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 -apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}header{padding:22px 18px 10px;background:#17262b}h1{font-size:24px;margin:0;color:var(--gold)}h2{font-size:18px;margin:0 0 10px}small,.muted{color:var(--muted)}main{padding:12px;max-width:760px;margin:auto;padding-bottom:40px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;margin:12px 0}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{background:#132328;padding:9px;border-radius:9px;font-size:14px}button,select,input,textarea{font:inherit}button{background:#e4bc76;color:#17232a;border:0;border-radius:10px;padding:12px 13px;font-weight:700;cursor:pointer;margin:4px 3px 4px 0}button.secondary{background:#324951;color:#f6ede0}button.danger{background:#8e4848;color:white}button:disabled{opacity:.4}input,textarea,select{background:#142329;color:var(--text);border:1px solid #567077;border-radius:9px;padding:10px;width:100%}textarea{min-height:80px}nav{display:flex;gap:5px;overflow-x:auto;padding:8px 12px;background:#17262b;position:sticky;top:0;z-index:2}nav button{white-space:nowrap;font-size:13px;margin:0;padding:9px;background:#344950;color:white}nav button.active{background:#e4bc76;color:#152329}p{margin:8px 0}ul{padding-left:20px}li{margin-bottom:5px}.log{padding:9px 0;border-bottom:1px solid #35464d;font-size:14px}.pill{display:inline-block;padding:2px 9px;background:#34464a;border-radius:30px;font-size:12px;color:var(--gold)}.good{color:var(--green)}.bad{color:#eeaaa4}.hide{display:none}.two{display:grid;grid-template-columns:1fr 1fr;gap:7px}.note{font-size:13px;color:var(--muted)}details{border:1px solid #42575e;border-radius:10px;padding:10px;margin-top:9px}summary{cursor:pointer}hr{border:0;border-top:1px solid var(--line)}@media(min-width:650px){.stats{grid-template-columns:repeat(4,1fr)}} </style></head><body><header><h1>浮生無界・萬世因果</h1><small>V0.3 人物測試｜保留 V0.3 進度 · 無 AI 偏袒 · 本機存檔</small></header><nav id="tabs"></nav><main id="app"></main><script>
'use strict';
const KEY='fusheng_v03_save',PREVIOUS_KEY='fusheng_v02_save',LEGACY_KEY='fusheng_v01_save',VERSION='rules-0.3',WORLD=['九州仙俠','江湖亂世','山河田園'],NAMES=['沈望','林秋','顧行舟','韓青','柳知微','陸玄','蘇禾','周謙','葉清','謝無雙','秦月','江嵐'];
let state=null,tab='人生';let notice='';
const $=id=>document.getElementById(id), fmt=n=>Number(n).toLocaleString('zh-TW');
function clone(x){return JSON.parse(JSON.stringify(x))}
function randomSeed(){return (Math.floor(Math.random()*0xffffffff)>>>0)||1234567}
function roll(s){s.seed=(Math.imul(s.seed,1664525)+1013904223)>>>0;return s.seed/4294967296}
function rand(s,a,b){return a+Math.floor(roll(s)*(b-a+1))}
function choose(s,a){return a[rand(s,0,a.length-1)]}
const NPC_FIRST=['柳映秋','顧懷山','秦若蘭','謝清和','韓月棠','周遠','白霜','陸庭川','蘇青竹','江月','宋雲','許明珠'];
const NPC_JOBS=['雜貨商','獵戶','學徒','藥師','農人','鏢師','旅人','茶館掌櫃'];
const NPC_GOALS=['攢錢成家','遠赴他鄉','保護家人','尋求技藝突破','擴張生意','遠離江湖恩怨','調查失蹤親友','追求安穩生活'];
const NPC_STYLES=['務實','強勢','獨立','溫和','精於算計','執著','冷漠','好奇'];
function generateNpcs(l){let taken=new Set();let a=[];for(let i=0;i<5;i++){let name=choose(l,NPC_FIRST);while(taken.has(name))name=choose(l,NPC_FIRST);taken.add(name);let obsession=rand(l,0,100);let disposition=rand(l,-60,45);a.push({id:'npc-'+i,name,age:rand(l,17,65),sex:choose(l,['男','女']),job:choose(l,NPC_JOBS),style:choose(l,NPC_STYLES),goal:choose(l,NPC_GOALS),obsession,temper:rand(l,5,95),independence:rand(l,5,95),trust:rand(l,5,35),affection:disposition,met:false,conversations:0,lastSeen:0,location:l.location,notes:[]})}return a}
function ensureNpcs(l){if(!l)return;if(!Array.isArray(l.npcs)){l.npcs=generateNpcs(l);event(l,'人物生成','本世生成獨立 NPC 檔案；人物不會自動偏愛主角。',{npcCount:l.npcs.length})}}
function npcInteract(idx,type){let l=current();if(!l||!l.alive)return;ensureNpcs(l);let n=l.npcs[idx];if(!n)return;let description='',detail={npcId:n.id,npcName:n.name,action:type,before:{trust:n.trust,affection:n.affection,obsession:n.obsession,goal:n.goal},rule:'人物初始好感不偏袒玩家；結果由人際數值、隨機判定與人格影響'};l.turn++;let draw=rand(l,1,100),chance=Math.max(5,Math.min(85,35+Math.floor(n.trust/3)+Math.floor(n.affection/5)-Math.floor(n.independence/8)));if(type==='talk'){n.met=true;n.conversations++;n.lastSeen=l.turn;if(draw<=chance){let t=rand(l,1,3);n.trust=Math.min(100,n.trust+t);description=n.name+'與你交談，態度略微緩和。對方仍在意自己的目標：「'+n.goal+'」。';}else{description=n.name+'沒有打算迎合你，談話冷淡或意見相左；對方目前更關心「'+n.goal+'」。';if(draw>90)n.affection=Math.max(-100,n.affection-2)}advanceHours(l,1)}else if(type==='help'){n.met=true;let fee=2;if(l.money<fee){description='你沒有足夠的 2 兩資源提供實際協助，不能憑空讓對方感激。'}else{l.money-=fee;let accepted=draw<=Math.max(10,Math.min(85,40+n.trust/3-n.independence/5));if(accepted){n.trust=Math.min(100,n.trust+rand(l,2,7));description=n.name+'接受了你提供的資源，信任略有提高，但不代表愛上你。'}else{description=n.name+'拒絕了你的安排。你投入的 2 兩用於準備，並未換來好感。'}}advanceHours(l,2)}else if(type==='distance'){n.met=true;n.lastSeen=l.turn;let decrease=rand(l,4,10);n.affection=Math.max(-100,n.affection-decrease);description='你明確表達希望減少往來。'+n.name+'的反應由既有個性與處境決定，不會立刻轉性。';advanceHours(l,1)}
if(l.alive){detail.draw=draw;detail.chance=chance;detail.after={trust:n.trust,affection:n.affection,obsession:n.obsession};event(l,'人物互動',description,detail)}store();render()}
function npcDaily(l){if(!l||!l.npcs)return;for(const n of l.npcs){let draw=rand(l,1,100);if(n.met&&n.obsession>=80&&draw<=3){let knewWhere=n.location===l.location;if(knewWhere){event(l,'NPC自主行動',n.name+'因高度執著再次打聽你的消息，但是否成功接觸並不保證。',{npc:n.id,obsession:n.obsession});}else event(l,'NPC自主行動',n.name+'試圖打聽舊識下落，因不知道正確位置而沒有找到人。',{npc:n.id})}else if(draw<=2){n.notes.push('第'+l.year+'年：繼續追求個人目標「'+n.goal+'」');if(n.notes.length>12)n.notes.shift()}}}
function newState(){return {format:1,ruleVersion:VERSION,lives:[],current:null,created:new Date().toISOString()}}
function makeLife(s){let seed=randomSeed(),tmp={seed};let era=rand(tmp,50,900);let type=choose(tmp,WORLD);let father=choose(tmp,['農家','商戶','獵戶','武人','寒門','官宦']);let name=choose(tmp,NAMES);let knowledge=father==='農家'?rand(tmp,25,55):rand(tmp,0,18);let practice=father==='農家'?rand(tmp,18,45):rand(tmp,0,15);let sex=choose(tmp,['男','女']);let constitution=rand(tmp,1,1000)<=15?'特殊靈脈':rand(tmp,1,1000)<=12?'先天強健':'普通凡體';let life={sex,constitution,hour:8,strength:100,strengthCap:100,staminaCap:100,mp:constitution==='特殊靈脈'?20:0,mpCap:constitution==='特殊靈脈'?20:0,cultivation:0,id:'life-'+Date.now()+'-'+seed,seed,name,world:type,era,year:era,day:1,age:16,alive:true,cause:null,born:father,health:100,hp:100,maxHp:100,stamina:100,money:father==='商戶'?80:rand(tmp,12,45),grain:4,seedItems:2,harvest:0,level:0,xp:0,skills:{farmKnowledge:knowledge,farmPractice:practice,combat:father==='武人'?rand(tmp,25,50):rand(tmp,2,18)},relationships:[{name:'村中農師',relation:'相識',trust:25}],location:'青溪村',flags:{field:false},turn:0,events:[],activeEnemy:null,checkpoints:[],timelineOrigin:era,bazi:'簡化命格：'+choose(tmp,['木旺','火旺','土旺','金旺','水旺','平衡']),destiny:'此為遊戲隨機命格，非正式八字或紫微排盤'};life.npcs=generateNpcs(life);event(life,'出生','生為'+sex+'性，體質為'+constitution+'，生於'+type+'，'+father+'之家。命格與時間線皆為本世獨立生成。',{seed:seed});return life}
function event(life,type,desc,detail={}){life.events.push({turn:life.turn,date:life.year+'年 第'+life.day+'日',type,desc,detail});if(life.events.length%20===0){life.checkpoints.push({turn:life.turn,year:life.year,day:life.day,money:life.money,health:life.health});}}
function store(){try{localStorage.setItem(KEY,JSON.stringify(state));notice='已存到本機';return true}catch(e){notice='存檔失敗：'+e.message;return false}}
function normalizeLife(l){if(!l)return l;l.sex??='未記錄';l.constitution??='普通凡體';l.hour??=8;l.strength??=100;l.strengthCap??=100;l.staminaCap??=100;l.mp??=0;l.mpCap??=0;l.cultivation??=0;ensureNpcs(l);return l}
function boot(){try{let saved=JSON.parse(localStorage.getItem(KEY));if(saved&&saved.format===1){state=saved}else{let legacy=JSON.parse(localStorage.getItem(PREVIOUS_KEY)||localStorage.getItem(LEGACY_KEY));if(legacy&&legacy.format===1){state=legacy;state.ruleVersion=VERSION;normalizeLife(state.current);state.lives.forEach(normalizeLife);localStorage.setItem(KEY,JSON.stringify(state));notice='已複製舊版存檔升級；舊版本機資料保留。'}else state=newState()}}catch(e){state=newState();notice='無法載入舊存檔，請保留備份：'+e.message}render()}
function current(){return state.current}
function advance(l,days){for(let i=0;i<days&&l.alive;i++){l.day++;if(l.day>360){l.day=1;l.year++;l.age++;}let ageRisk=l.age<40?.000003:l.age<60?.000015:l.age<75?.00007:l.age<90?.0003:.0012;let healthRisk=(100-l.health)/100*0.0003;if(i===0&&l.npcs)npcDaily(l);if(roll(l)<ageRisk+healthRisk){die(l,'疾病或自然衰老');break}}}
function advanceHours(l,h){let total=l.hour+h;let days=Math.floor(total/24);l.hour=total%24;if(days>0)advance(l,days)}
function regen(l,h){let special=l.constitution==='特殊靈脈'&&l.cultivation>0;let gained=Math.floor(h*(special?10:6));l.stamina=Math.min(l.staminaCap,l.stamina+gained);let heal=Math.floor(h*(special?0.7:0.15));l.health=Math.min(100,l.health+heal);l.hp=Math.min(l.maxHp,l.hp+Math.floor(h*(special?1.5:0.25)));if(special)l.mp=Math.min(l.mpCap,l.mp+Math.floor(h*2));advanceHours(l,h);return {stamina:gained,health:heal}}
function die(l,cause){l.alive=false;l.hp=0;l.cause=cause;event(l,'死亡',l.name+'因'+cause+'離世，享年'+l.age+'歲。本世封存，下一世重新隨機年代。');state.lives.push(clone(l));state.current=null;notice='本世已封存。可開始新人生。'}
function action(kind){let l=current();if(!l||!l.alive)return;let old=clone({money:l.money,grain:l.grain,health:l.health,hp:l.hp,stamina:l.stamina,skills:l.skills});l.turn++;let txt='',detail={};const r=()=>rand(l,1,10000);if(kind==='learn'){if(l.money<2){txt='沒有足夠的學費（需 2 兩）。';}else{l.money-=2;l.skills.farmKnowledge=Math.min(100,l.skills.farmKnowledge+rand(l,2,5));txt='向農師學習土壤、灌溉與作物管理。花費 2 兩，農業理論提升。';advance(l,7)}}
else if(kind==='train'){l.skills.combat=Math.min(100,l.skills.combat+rand(l,1,3));l.stamina=Math.max(15,l.stamina-20);txt='練習基本武術，戰鬥熟練度小幅提升，體力下降。';advance(l,3)}
else if(kind==='rest2'||kind==='rest8'){let h=kind==='rest2'?2:8;let a=regen(l,h);txt='休息 '+h+' 小時，依恢復速率回復最多 '+a.stamina+' 體力。健康與傷勢恢復較慢。';detail={hours:h,recovery:a}}
else if(kind==='strengthTrain'){if(l.stamina<15){txt='體力不足 15，無法進行有效力量訓練。'}else{l.stamina-=15;let gain=l.constitution==='普通凡體'?rand(l,0,2):rand(l,1,3);l.strengthCap=Math.min(l.constitution==='普通凡體'?150:250,l.strengthCap+gain);l.strength=Math.min(l.strengthCap,l.strength+gain);l.staminaCap=Math.min(l.constitution==='普通凡體'?150:240,l.staminaCap+rand(l,0,1));txt='完成三天循序漸進的力量訓練；力量上限增加 '+gain+'。訓練消耗體力與時間。';advance(l,3)}}
else if(kind==='lift15'||kind==='lift30'||kind==='lift45'){let kg=Number(kind.slice(4));let capacity=l.strength*0.25;let cost=Math.ceil(kg*0.5);detail={kg,capacityKg:capacity,strength:l.strength,staminaCost:cost};if(l.stamina<cost){txt='體力不足，無法安全搬運。'}else if(kg>capacity){txt='目前力量可安全搬運約 '+capacity.toFixed(1)+' 公斤，無法直接搬動 '+kg+' 公斤；可以訓練或使用合適工具。'}else{l.stamina-=cost;txt='順利搬運 '+kg+' 公斤物品，消耗 '+cost+' 點體力。';advanceHours(l,1)}}
else if(kind==='meditate'){if(l.constitution!=='特殊靈脈'&&l.cultivation===0){txt='目前沒有修仙資質、功法或機緣，不能直接開始修煉。'}else{l.cultivation+=1;l.mpCap+=1;advanceHours(l,4);txt='依照已有的特殊靈脈修行四小時，法力上限提高 1；現有法力並未瞬間補滿。'}}
else if(kind==='spellLift'){let kg=30,cost=10;if(l.cultivation===0){txt='尚未掌握搬運法術，不能施放。'}else if(l.mp<cost){txt='法力不足 '+cost+'，施法失敗。'}else{l.mp-=cost;advanceHours(l,1);txt='使用搬運法術移動 '+kg+' 公斤物品，耗費 '+cost+' 點法力。'}}
else if(kind==='work'){let know=l.skills.farmKnowledge,prac=l.skills.farmPractice;let chance=Math.min(9500,Math.max(500,2000+know*30+prac*35));let draw=r(),success=draw<=chance;detail={chance,draw,formula:'2000+農業理論×30+實務×35，限制 5%～95%'};if(success){l.money+=rand(l,3,7);l.skills.farmPractice=Math.min(100,prac+1);txt='受僱完成農務，獲得工錢，實務經驗增加。';}else{l.money+=1;txt='農務處理不佳，只拿到少量工錢，未提升熟練度。';}advance(l,1)}
else if(kind==='buySeeds'){if(l.money<3){txt='銀兩不足，無法購買種子。';}else{l.money-=3;l.seedItems+=3;txt='花費 3 兩購買 3 份種子。';advance(l,1)}}
else if(kind==='plant'){if(l.flags.field){txt='農地已有作物，不能重複播種。';}else if(l.seedItems<1){txt='沒有種子，無法播種。';}else{l.seedItems--;let know=l.skills.farmKnowledge,prac=l.skills.farmPractice;let chance=Math.min(9500,Math.max(300,1500+know*32+prac*36));let draw=r();detail={chance,draw,formula:'1500+知識×32+經驗×36，限制3%～95%'};if(draw<=chance){l.flags.field={planted:l.year+'-'+l.day,days:0,care:0};txt='播種成功，但作物尚未成熟，至少需要 30 天照料。';}else{txt='播種失敗，浪費 1 份種子。';}advance(l,1)}}
else if(kind==='tend'){if(!l.flags.field){txt='沒有正在生長的農作物。';}else{l.flags.field.care++;l.flags.field.days+=7;l.skills.farmPractice=Math.min(100,l.skills.farmPractice+1);advance(l,7);txt='照料農田七日。成熟進度 '+l.flags.field.days+'/30 天。';}}
else if(kind==='harvest'){if(!l.flags.field){txt='沒有可收成的農地。';}else if(l.flags.field.days<30){txt='尚未成熟，不能提前收成。';}else{let crop=2+Math.floor(l.flags.field.care/2)+Math.floor(l.skills.farmKnowledge/30);l.grain+=crop;l.harvest+=crop;l.flags.field=false;txt='收成 '+crop+' 份糧食。產量取決於管理次數與農業知識。';advance(l,1)}}
else if(kind==='explore'){let chance=1000+Math.min(2500,l.skills.combat*20);let draw=r();detail={chance,draw,formula:'奇遇基率10%＋武藝影響，非必定有利'};if(draw<=chance){l.money+=2;txt='在林中找到可出售的藥草，賣得 2 兩。';}else if(draw<=chance+2200){l.health=Math.max(1,l.health-8);txt='迷途受傷，健康下降 8 點。';}else{txt='山林平靜，沒有特殊收穫。';}advance(l,2)}
else if(kind==='fight'){l.activeEnemy={name:'山道盜匪',hp:85,maxHp:85,skill:42,atk:22,def:9,stamina:90};txt='遭遇山道盜匪！對方的武藝與裝備高於普通新手，請評估是否撤退。';}
else if(kind==='attack'||kind==='defend'||kind==='flee'){combat(l,kind);render();return}
if(l.alive){detail.before=old;detail.after={money:l.money,grain:l.grain,health:l.health,hp:l.hp,stamina:l.stamina,skills:clone(l.skills)};event(l,kind,txt,detail)}store();render()}
function combat(l,move){let e=l.activeEnemy;if(!e)return;let desc=[],detail={move,playerSkill:l.skills.combat,enemySkill:e.skill};if(move==='flee'){let chance=Math.max(800,Math.min(8000,4200+(l.skills.combat-e.skill)*45+(l.stamina-50)*22));let draw=rand(l,1,10000);detail.escape={chance,draw};if(draw<=chance){l.activeEnemy=null;desc.push('成功脫離戰鬥。');}else desc.push('逃跑失敗！');}else if(move==='attack'){let chance=Math.max(300,Math.min(9200,4600+(l.skills.combat-e.skill)*75));let draw=rand(l,1,10000);detail.attack={chance,draw};l.stamina=Math.max(0,l.stamina-15);if(draw<=chance){let damage=Math.max(1,10+Math.floor(l.skills.combat*.36)-e.def+rand(l,0,8));e.hp=Math.max(0,e.hp-damage);desc.push('攻擊命中，造成 '+damage+' 傷害。');}else desc.push('攻擊失手或被格擋。');}else{l.stamina=Math.max(0,l.stamina-8);desc.push('採取防禦姿態，降低本回合受到的傷害。')}
if(e.hp<=0){desc.push('盜匪失去戰鬥能力。你獲勝，但沒有憑空提升修為。');l.activeEnemy=null;l.skills.combat=Math.min(100,l.skills.combat+2);}
else if(l.activeEnemy){let chance=Math.max(800,Math.min(9500,5600+(e.skill-l.skills.combat)*55+(100-l.stamina)*8));let draw=rand(l,1,10000);detail.enemyAttack={chance,draw};if(draw<=chance){let damage=Math.max(1,e.atk-Math.floor(l.skills.combat*.12)+rand(l,0,9)-(move==='defend'?12:0));l.hp=Math.max(0,l.hp-damage);desc.push('敵人命中，受到 '+damage+' 傷害。');}else desc.push('敵人攻擊落空。');if(l.hp<=0){die(l,'戰鬥重傷');}}
if(l.alive){l.turn++;event(l,'戰鬥',desc.join(' '),detail)}store();render()}
function endCurrent(archive){let l=current();if(!l)return;let word=archive?'結束並封存':'放棄並刪除';if(!confirm('確定要'+word+'目前這一世？此操作不可撤回，建議先匯出備份。'))return;if(archive){l.alive=false;l.cause='玩家主動結束';event(l,'封存','玩家手動結束當世，記錄保留。');state.lives.push(clone(l))}state.current=null;notice=archive?'此世已封存，可重新出生。':'已刪除本世，歷史不保留。';store();tab='人生';render()}
function manualSave(){store();render()}
function create(){if(current())return;state.current=makeLife(state);notice='已建立新人生；與前世年代不連續。';store();tab='人生';render()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function button(label,kind){return `<button onclick="action('${kind}')">${label}</button>`}
function exportSave(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='浮生無界-存檔-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function importSave(input){let f=input.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let obj=JSON.parse(reader.result);if(obj.format!==1||!['rules-0.1','rules-0.2',VERSION].includes(obj.ruleVersion)||!Array.isArray(obj.lives))throw Error('不支援的存檔格式或規則版本');if(!confirm('匯入將取代目前存檔。確定嗎？'))return;state=obj;state.ruleVersion=VERSION;normalizeLife(state.current);state.lives.forEach(normalizeLife);store();notice='匯入完成';tab='人生';render()}catch(e){alert('匯入失敗：'+e.message)}};reader.readAsText(f)}
function reset(){if(!confirm('將清除本機所有人生及封存紀錄。請先匯出備份。確定嗎？'))return;state=newState();store();tab='人生';render()}
function timeline(l){return l.events.slice(-30).reverse().map(e=>`<div class="log"><span class="pill">${esc(e.date)}｜${esc(e.type)}</span><p>${esc(e.desc)}</p><details><summary>檢視判定與數值</summary><pre style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(JSON.stringify(e.detail,null,2))}</pre></details></div>`).join('')}
function render(){let tabs=['人生','行動','人物','世界分析','事件帳本','存檔'];$('tabs').innerHTML=tabs.map(x=>`<button class="${tab===x?'active':''}" onclick="tab='${x}';render()">${x}</button>`).join('');let l=current(),html='';if(notice)html+=`<div class="card note">${esc(notice)}</div>`;
if(tab==='人生'){if(!l){html+=`<div class="card"><h2>一世一人生</h2><p>每次隨機出生年代、世界與家庭；正常不繼承前世記憶。死亡後封存本世，再生成新人生。</p><button onclick="create()">開始隨機人生</button></div>`}else{html+=`<div class="card"><h2>${esc(l.name)} <span class="pill">${l.alive?'在世':'已故'}</span></h2><p>${esc(l.world)}｜${esc(l.born)}｜${esc(l.location)}</p><div class="stats">${[['性別',l.sex],['體質',l.constitution],['年齡',l.age+'歲'],['時間',l.year+'年 第'+l.day+'日 '+l.hour+'時'],['銀兩',fmt(l.money)+'兩'],['生命',l.hp+'/'+l.maxHp],['健康',l.health+'/100'],['體力',l.stamina+'/'+l.staminaCap],['力量',l.strength+'/'+l.strengthCap],['法力',l.mp+'/'+l.mpCap],['糧食',l.grain+'份'],['種子',l.seedItems+'份']].map(x=>`<div class="stat">${x[0]}<br><strong>${x[1]}</strong></div>`).join('')}</div><p>命格：${esc(l.bazi)} <small>（尚非正式排盤）</small></p><p>第 ${l.turn} 回合；核心規則 ${VERSION}</p><button class="secondary" onclick="manualSave()">手動存檔</button><button class="secondary" onclick="endCurrent(true)">結束並封存這一世</button><button class="danger" onclick="endCurrent(false)">刪除這一世重新開始</button></div>`}html+=`<div class="card"><h2>封存人生</h2>${state.lives.length?state.lives.slice().reverse().map(x=>`<p>${esc(x.name)}｜${esc(x.world)}｜${x.age}歲｜${esc(x.cause||'未知')}｜${x.turn}回合</p>`).join(''):'尚無已結束的人生'}</div>`}
if(tab==='行動'){if(!l)html='<div class="card">請先在「人生」建立角色。</div>';else if(l.activeEnemy){let e=l.activeEnemy;html=`<div class="card"><h2>⚔️ 戰鬥中：${esc(e.name)}</h2><p>敵人 HP ${e.hp}/${e.maxHp}｜武藝 ${e.skill}｜攻擊 ${e.atk}｜防禦 ${e.def}</p><p>玩家 HP ${l.hp}/${l.maxHp}｜武藝 ${l.skills.combat}｜體力 ${l.stamina}</p>${button('攻擊','attack')}${button('防禦','defend')}${button('嘗試撤退','flee')}<p class="note">無主角保護；攻擊與撤退機率均可在事件帳本查詢。</p></div>`}else html=`<div class="card"><h2>學習與生活</h2>${button('向農師學習（2兩／7天）','learn')}${button('農務打工（1天）','work')}${button('購買種子（3兩）','buySeeds')}${button('播種','plant')}${button('照顧農地（7天）','tend')}${button('收成','harvest')}${button('休息（2小時）','rest2')}${button('睡眠（8小時）','rest8')}${button('力量訓練（3天）','strengthTrain')}${button('搬運15公斤','lift15')}${button('搬運30公斤','lift30')}${button('搬運45公斤','lift45')}${button('修行靜坐（4小時）','meditate')}${button('施展搬運術（法力10）','spellLift')}</div><div class="card"><h2>江湖與探索</h2>${button('武藝訓練（3天）','train')}${button('探索山林（2天）','explore')}${button('挑戰山道盜匪','fight')}<p class="note">第一版採有限行動與確定規則；不支援 AI 自由敘事，避免假裝已經完成 AI 系統。</p></div><div class="card"><h2>現有能力與資源</h2><p>農業理論：${l.skills.farmKnowledge}/100</p><p>耕作實務：${l.skills.farmPractice}/100</p><p>戰鬥熟練：${l.skills.combat}/100</p><p>性別：${esc(l.sex)}；體質：${esc(l.constitution)}</p><p>力量：${l.strength}/${l.strengthCap}；體力：${l.stamina}/${l.staminaCap}；法力：${l.mp}/${l.mpCap}；修行次數：${l.cultivation}</p><p>農田：${l.flags.field?'生長 '+l.flags.field.days+'/30 天':'無作物'}</p></div>`}
if(tab==='人物'){if(!l)html='<div class="card">先建立或載入本世人生才能查看人物。</div>';else{ensureNpcs(l);html='<div class="card"><h2>本世 NPC</h2><p class="note">每位 NPC 都有獨立性格、人生目標與記憶。執著不代表喜歡你，也不保證知道你的行蹤。此版是離線規則測試，尚無 AI 自由對話。</p></div>'+l.npcs.map((n,i)=>`<div class="card"><h2>${esc(n.name)} <span class="pill">${esc(n.style)}</span></h2><p>${esc(n.sex)}｜${n.age}歲｜${esc(n.job)}｜${n.met?'已相識':'尚未正式交談'}</p><p>個人目標：${esc(n.goal)}</p><div class="stats">${[['信任',n.trust],['好感',n.affection],['執著程度',n.obsession],['獨立程度',n.independence]].map(x=>`<div class="stat">${x[0]}<br><strong>${x[1]}</strong></div>`).join('')}</div><p class="note">已交談 ${n.conversations} 次；有自己的立場，不會因玩家身分自動示好。</p><button onclick="npcInteract(${i},'talk')">與其交談（1小時）</button><button class="secondary" onclick="npcInteract(${i},'help')">嘗試協助（2兩）</button><button class="secondary" onclick="npcInteract(${i},'distance')">保持距離</button></div>`).join('')}}
if(tab==='世界分析'){html=l?`<div class="card"><h2>角色狀態分析</h2><p>世界：${esc(l.world)}；本世起始年代：${l.timelineOrigin}；現在：${l.year}</p><p>農業理論：${l.skills.farmKnowledge}；農務實作：${l.skills.farmPractice}；武藝：${l.skills.combat}</p><p>已完成事件：${l.events.length}；生命：${l.hp}；健康：${l.health}</p><p>人際：${l.relationships.map(r=>esc(r.name+'（'+r.relation+'）')).join('、')}</p><p>本世沒有從前世繼承技能或記憶。</p><details><summary>核心規則（鎖定）</summary><p>種田要有種子、土地條件與時間；戰鬥按雙方數值逐回合判定；自然死亡與年齡及健康有關；AI 不管理數值；同一世事件持續記錄。凡人須按小時恢復體力，修仙特質只有實際修行後才有超常恢復。強度需長期訓練提高。</p><p>這是第一版簡化演算法，沒有正式八字排盤、完整 NPC 社會或 AI 引擎。</p></details></div>`:'<div class="card">沒有正在進行的人生。可查閱已封存檔案。</div>'}
if(tab==='事件帳本'){html=`<div class="card"><h2>可追溯事件帳本</h2><p class="note">顯示最近 30 筆；全部事件保留於存檔 JSON。</p>${l?timeline(l):'本世未開始或已封存。'}</div>`}
if(tab==='存檔'){html=`<div class="card"><h2>備份與恢復</h2><p>本機每次行動後自動保存，也可以在人生頁手動存檔。建議經常匯出 JSON 到 iPhone「檔案」或 iCloud Drive。</p><button onclick="exportSave()">匯出完整存檔 JSON</button><p>匯入先前備份：</p><input type="file" accept=".json,application/json" onchange="importSave(this)"><hr><button class="danger" onclick="reset()">清空所有人生（危險）</button></div><div class="card"><h2>目前限制</h2><p>本機儲存使用 localStorage，清除 Safari 網站資料可能遺失，並非雲端永久存檔；需要手動匯出備份。</p><p>GitHub Pages 為公開靜態網站，不能放 AI API 密鑰或私人存檔。後續 AI 必須使用安全後端。</p><p>規則版本：${VERSION}</p></div>`}
$('app').innerHTML=html}
boot();</script></body></html>
